  if (fn) { e.stopPropagation(); return showNote(fn); }
  const w = e.target.closest('.w');
  if (w) { e.stopPropagation(); select(+w.closest('[data-v]').dataset.v); return showWord(w); }
  const p = e.target.closest('[data-v]');
  if (p) select(+p.dataset.v, e.shiftKey ? 'range' : (e.metaKey || e.ctrlKey) ? 'toggle' : undefined);
};
$('selbar').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  e.stopPropagation();
  if (t.dataset.hl !== undefined) { sorted().forEach(v => setVerse(v, { color: t.dataset.hl })); refreshBible(); }
  else if (t.dataset.act === 'copy') copySel();
  else if (t.dataset.act === 'note') openNote(sorted()[0], t);
  else if (t.dataset.act === 'bm') toggleBookmark();
  else if (t.dataset.act === 'clear') { sel.clear(); refreshBible(); }
};
$('comTabs').onclick = e => {
  const t = e.target.closest('.tab'); if (!t) return;
  if (t.dataset.comm) { S.comm = t.dataset.comm; S.tab = 'comm'; if (S.comm2 === S.comm) S.comm2 = Object.keys(comms).find(n => n !== S.comm) || ''; }
  else if (t.dataset.dict) { S.dict = t.dataset.dict; S.tab = 'dict'; }
  else if (t.dataset.xref !== undefined) S.tab = 'xref';
  else if (t.dataset.search !== undefined) S.tab = 'search';
  else if (t.dataset.saved !== undefined) S.tab = 'saved';
  else if (t.dataset.split !== undefined) S.split = !S.split;
  else if (t.dataset.hideComm !== undefined) { S.hideComm = true; save(); renderComm(); return renderBible(); }
  save(); renderComm(); if (S.v) syncComm(S.v);
};
$('comTabs2').onclick = e => {
  const t = e.target.closest('[data-comm2]'); if (!t) return;
  S.comm2 = t.dataset.comm2; save(); renderComm(); if (S.v) syncComm(S.v);
};
// 검색 결과: 번역본·범위 바꾸기
$('comm').onchange = e => {
  const o = e.target.dataset.sopt; if (!o || !hits) return;
  hits.book = 0;
  if (o === 'ver') { hits.ver = e.target.value; hits.bible = null; renderHits(); runBibleSearch(); }
  else { hits.range = e.target.value; renderHits(); }
};
$('comm').onsubmit = e => { if (e.target.id === 'dictForm') { e.preventDefault(); dictSearch($('dq').value); } };
$('comm').onclick = e => {
  const sc = e.target.closest('[data-scope]');
  if (sc) { hits.scope = sc.dataset.scope; return renderHits(); }
  const sb = e.target.closest('[data-sbook]');
  if (sb) { hits.book = +sb.dataset.sbook === hits.book ? 0 : +sb.dataset.sbook; renderHits(); return $('comm').scrollTop = 0; }
  const dg = e.target.closest('[data-dict-go], [data-strong]');
  if (dg) {
    e.preventDefault();
    if (dg.dataset.dictGo) D.scroll = $('comm').scrollTop; // 목록으로 돌아올 위치
    D.entry = dg.dataset.dictGo || dg.dataset.strong;
    return renderDict(0);
  }
  if (e.target.closest('[data-dict-back]')) { D.entry = ''; return renderDict(D.scroll); }
  const dl = e.target.closest('[data-dict-lang]');
  if (dl) { D.lang = dl.dataset.dictLang; return renderDict(0); }
  if (e.target.closest('[data-dict-clear]')) { D.q = ''; D.list = null; return renderDict(0); }
  const h = e.target.closest('.hit');
  if (h?.dataset.i) { const [b, c, v] = REF[+h.dataset.i]; return go(b, c, v, true); }
  if (h?.dataset.go) {
    const [b, c, v] = h.dataset.go.split('.').map(Number);
    if (h.dataset.toComm !== undefined) S.tab = 'comm';
    return go(b, c, v, true);
  }
  linkClick(e);
};
$('comm2').onclick = linkClick;
function linkClick(e) {
  const a = e.target.closest('a[data-ref]'); if (!a) return;
  e.preventDefault();
  const [b, c, v] = parseRef(a.dataset.ref);
  if (b) go(b, c, v, true);
}

// 주석 속 성경 참조에 마우스를 올리면 본문 미리보기
function showTip(e) {
  const a = e.target.closest('a[data-ref]'), tip = $('tip');
  const ver = firstLocal(); // 미리보기는 내려받은 성경으로 (ESV는 마우스 올릴 때마다 요청하면 사용량 초과)
  if (!a || !ver) return tip.classList.remove('open');
  const m = a.dataset.ref.match(/id=(\d+)\.(\d+)\.(\d+)(?:-(\d+)\.(\d+)\.(\d+))?/); if (!m) return;
  const from = START[+m[1]]?.[m[2] - 1] + (+m[3]) - 1;
  const to = m[4] ? START[+m[4]]?.[m[5] - 1] + (+m[6]) - 1 : from;
  if (!(from >= 0)) return;
  const L = bibles[ver], ids = Array.from({ length: Math.min(to - from + 1, 6) }, (_, i) => from + i);
  tip.innerHTML = `<b>${refName(...REF[from])}${to > from ? '-' + REF[to][2] : ''} · ${esc(nm(ver))}</b>` +
    ids.map(i => (ids.length > 1 ? `<span class="vn">${REF[i][2]}</span>` : '') + verseHtml(L[i] || '')).join(' ') + (to - from >= 6 ? ' …' : '');
  tip.classList.add('open');
  const r = a.getBoundingClientRect();
  tip.style.left = Math.max(16, Math.min(r.left, innerWidth - tip.offsetWidth - 16)) + 'px';
  tip.style.top = (r.bottom + tip.offsetHeight + 8 > innerHeight ? r.top - tip.offsetHeight - 6 : r.bottom + 6) + 'px';
}
for (const id of ['comm', 'comm2']) {
  $(id).onmouseover = showTip;
  $(id).onmouseleave = () => $('tip').classList.remove('open');
}

$('q').onkeydown = e => { if (e.key === 'Enter') search(e.target.value); if (e.key === 'Escape') { e.target.value = ''; search(''); e.target.blur(); } };
document.onkeydown = e => {
  if (e.key === 'Escape') { if (document.querySelector('.pop.open:not(#tip)')) return closePops(); if (sel.size) { sel.clear(); refreshBible(); } }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft' && e.altKey) return back();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
  // ↓/↑: 다음·이전 절 (장 끝이면 다음 장 첫 절 / 앞 장 마지막 절). 주석·사전 칸 안에서는 원래대로 스크롤
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.target.closest?.('#comm, #comm2, .pop')) {
    e.preventDefault();
    const n = VERSES[S.b - 1][S.c - 1], v = S.v ? S.v + (e.key === 'ArrowDown' ? 1 : -1) : 1; // 고른 절이 없으면 1절부터
    if (v >= 1 && v <= n) return select(v);
    if (e.key === 'ArrowDown') { if (S.c < VERSES[S.b - 1].length || S.b < 66) { step(1); select(1); } }
    else if (S.c > 1 || S.b > 1) { step(-1); select(VERSES[S.b - 1][S.c - 1]); }
  }
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
  // 글자를 드래그해 고른 게 없을 때만 선택한 절을 복사
  if (e.key === 'c' && (e.metaKey || e.ctrlKey) && sel.size && !String(getSelection())) { e.preventDefault(); copySel(); }
};

// 글자 크기·글꼴
let fs = prefs.get('fs', 17), serif = prefs.get('serif', true);
const applyFont = () => {
  document.documentElement.style.setProperty('--fs', fs + 'px');
  document.documentElement.style.setProperty('--read', serif ? 'var(--serif)' : 'var(--sans)');
  $('fontBtn').textContent = serif ? '명조' : '고딕';
  prefs.set('fs', fs); prefs.set('serif', serif);
};
$('smaller').onclick = () => { fs = Math.max(13, fs - 1); applyFont(); };
$('bigger').onclick = () => { fs = Math.min(26, fs + 1); applyFont(); };
$('fontBtn').onclick = () => { serif = !serif; applyFont(); };
applyFont();
checkNudge();

// 칸 너비: a = 성경 칸 비율(2칸), sa = 성경 칸 비율(3칸), b = 3칸일 때 남은 폭 중 첫 주석 비율
const COLS = { a: 0.535, sa: 0.355, b: 0.5 };
let cols = { ...COLS, ...prefs.get('cols', {}) };
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
function applyCols() {
  const st = $('main').style;
  st.setProperty('--c1', cols.a + 'fr'); st.setProperty('--c2', (1 - cols.a) + 'fr');
  st.setProperty('--s1', cols.sa + 'fr'); st.setProperty('--s2', (1 - cols.sa) * cols.b + 'fr'); st.setProperty('--s3', (1 - cols.sa) * (1 - cols.b) + 'fr');
}
document.querySelectorAll('.resizer').forEach(r => {
  r.onpointerdown = e => {
    e.preventDefault();
    r.setPointerCapture(e.pointerId);
    r.classList.add('drag'); document.body.classList.add('resizing');
    const box = $('main').getBoundingClientRect();
    r.onpointermove = ev => {
      const x = (ev.clientX - box.left) / box.width;
      if (r.dataset.r === 'b') cols.b = clamp((x - cols.sa) / (1 - cols.sa), 0.2, 0.8);
      else if (S.split) cols.sa = clamp(x, 0.2, 0.6);
      else cols.a = clamp(x, 0.2, 0.8);
      applyCols();
    };
    r.onpointerup = r.onpointercancel = () => {
      r.onpointermove = null;
      r.classList.remove('drag'); document.body.classList.remove('resizing');
      prefs.set('cols', cols);
    };
  };
  r.ondblclick = () => { cols = { ...COLS }; applyCols(); prefs.set('cols', cols); };
});
applyCols();

/* ---------- 내 세팅 1·2: 보는 구성(번역본·주석·2단·사전·글꼴·칸 너비 등)을 저장해 두고 바꾸기 ---------- */
let presets = prefs.get('presets', [null, null]);
const capture = () => ({
  versions: [...S.versions], comm: S.comm, comm2: S.comm2, split: S.split, hideComm: !!S.hideComm, dict: S.dict,
  tab: ['comm', 'dict', 'xref', 'saved'].includes(S.tab) ? S.tab : 'comm',
  fs, serif, cols: { ...cols }, gloss, wordSide,
});
const presetSummary = p => [
  p.versions.map(nm).join('+') || '성경 없음',
  p.hideComm ? '주석 숨김' : [p.comm, p.split && p.comm2].filter(Boolean).map(nm).join('+') || '주석 없음',
  `글자 ${p.fs}`, p.serif ? '명조' : '고딕',
].join(' · ');
function applyPreset(i) {
  const p = presets[i];
  if (!p) return flash(`세팅 ${i + 1}이 비어 있습니다. 내 세팅에서 먼저 저장하세요`);
  const vs = p.versions.filter(n => allVersions().includes(n)); // 지금 없는 파일은 건너뜀
  if (vs.length) S.versions = vs;
  if (commFiles[p.comm]) S.comm = p.comm;
  if (commFiles[p.comm2] && p.comm2 !== S.comm) S.comm2 = p.comm2;
  if (dictFiles[p.dict]) S.dict = p.dict;
  S.split = p.split && !!commFiles[S.comm2]; S.hideComm = p.hideComm;
  S.tab = p.tab === 'dict' && !S.dict ? 'comm' : p.tab;
  fs = p.fs; serif = p.serif; applyFont();
  cols = { ...COLS, ...p.cols }; applyCols(); prefs.set('cols', cols);
  gloss = p.gloss; prefs.set('gloss', gloss); document.body.classList.toggle('no-gloss', !gloss);
  wordSide = p.wordSide; prefs.set('wordSide', wordSide);
  sortVersions(); save(); refreshBible(); renderComm(); if (S.v) syncComm(S.v);
  flash(`세팅 ${i + 1}로 바꿨습니다`);
}
function renderPresets() {
  $('presetBox').innerHTML = '<b>내 세팅</b><p class="help">지금 보는 구성(번역본, 주석, 2단 보기, 사전, 글꼴·크기, 칸 너비)을 저장해 두고 한 번에 바꿉니다. 단축키 Alt+1, Alt+2</p>' +
    [0, 1].map(i => `<div class="slot"><div><b>세팅 ${i + 1}</b><small>${presets[i] ? esc(presetSummary(presets[i])) : '비어 있음'}</small></div>
      <button class="btn sm" data-psave="${i}">지금 상태 저장</button>
      <button class="btn sm primary" data-papply="${i}" ${presets[i] ? '' : 'disabled'}>불러오기</button></div>`).join('');
}
$('presetBtn').onclick = e => { e.stopPropagation(); renderPresets(); openPop($('presetBox'), $('presetBtn')); };
$('presetBox').onclick = e => {
  e.stopPropagation();
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.psave) { presets[+t.dataset.psave] = capture(); prefs.set('presets', presets); renderPresets(); flash(`세팅 ${+t.dataset.psave + 1}에 저장했습니다`); }
  if (t.dataset.papply) { closePops(); applyPreset(+t.dataset.papply); }
};
addEventListener('keydown', e => { if (e.altKey && (e.key === '1' || e.key === '2')) { e.preventDefault(); applyPreset(+e.key - 1); } });

Promise.all([
  idb('marks', 'readonly', s => s.getAll()).then(list => list.forEach(m => marks.set(m.id, m))).catch(() => {}),
  idb('files', 'readonly', s => s.getAll()).catch(() => []),
  probeEsvProxy(),
]).then(([, files]) => load(files || [], false));
</script>
</body>
</html>
