<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성경 뷰어</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16213f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/pretendard.css">
<style>
  /* 강조색은 코발트 하나(하이라이트 4색은 사용자 표시용). 모서리: 컨트롤 6px, 팝오버 10px */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --line: #e3e5ea; --fg: #1d2027; --muted: #646b7a;
    --accent: #2c4aa8; --accent-soft: #e8edfa; --on-accent: #ffffff; --red: #b4232c; --ot: #4b5b78;
    --hl-yellow: #fbefb4; --hl-green: #d7efd3; --hl-blue: #d7e4fa; --hl-pink: #f8dbe6;
    --shadow: 0 12px 32px rgb(29 32 39 / .12);
    --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --serif: "AppleMyungjo", "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    --read: var(--serif); --fs: 17px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317; --surface: #181a1f; --line: #2a2d35; --fg: #e4e6eb; --muted: #949aa8;
      --accent: #8fa7ee; --accent-soft: #232a40; --on-accent: #121317; --red: #f0857f; --ot: #a9b6cf;
      --hl-yellow: #48401c; --hl-green: #213b26; --hl-blue: #22314c; --hl-pink: #482532;
      --shadow: 0 12px 32px rgb(0 0 0 / .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .4; }
  input[type=file] { display: none; }

  /* 상단 바 */
  .bar { height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .btn { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); white-space: nowrap; transition: background .15s, transform .1s; }
  .btn:hover:not(:disabled) { background: var(--bg); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.icon { width: 32px; padding: 0; font-size: 18px; line-height: 1; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn.sm.icon { width: 28px; padding: 0; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
  .ref-btn { font-weight: 600; font-size: 15px; border-color: transparent; }
  .search { flex: 0 1 280px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); margin-left: auto; }
  .search:focus, .btn:focus-visible, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .status { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* 백업 알림 */
  .nudge { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13px; }
  .nudge[hidden] { display: none; }
  .nudge span { margin-right: auto; }

  /* 본문 영역: 성경 | 주석 (| 주석 2) */
  /* 칸 너비는 끌어서 조절 (--c1… 은 JS가 설정) */
  main { flex: 1; display: grid; grid-template-columns: minmax(0, var(--c1, 1.15fr)) minmax(0, var(--c2, 1fr)); min-height: 0; }
  main.split { grid-template-columns: minmax(0, var(--s1, 1.1fr)) minmax(0, var(--s2, 1fr)) minmax(0, var(--s3, 1fr)); }
  #pane2 { display: none; }
  main.split #pane2 { display: flex; }
  /* 주석 칸 숨김: 성경 칸만 */
  main.no-comm { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) !important; }
  main.no-comm > .pane:not(:first-child) { display: none !important; }
  .pane { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .resizer { position: absolute; top: 0; bottom: 0; left: -5px; width: 10px; cursor: col-resize; z-index: 5; touch-action: none; }
  .resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: transparent; transition: background .15s; }
  .resizer:hover::after, .resizer.drag::after { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  .pane + .pane { border-left: 1px solid var(--line); background: var(--bg); }
  .tabs { flex: none; display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { height: 28px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); white-space: nowrap; }
  .tab:hover { color: var(--fg); }
  .tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tabs .spacer { margin-left: auto; }
  .tabs .hint { color: var(--muted); font-size: 12px; align-self: center; white-space: nowrap; }
  .scroll { flex: 1; overflow-y: auto; padding: 24px 32px 96px; }

  /* 성경 */
  .chapter-title { font: 600 20px/1.3 var(--sans); margin: 0 0 16px; }
  .verse { font: var(--fs)/1.85 var(--read); padding: 2px 8px; margin: 0 -8px 4px; border-radius: 6px; cursor: pointer; max-width: 42em; user-select: none; }
  .verse:hover { background: var(--bg); }
  .vn { font: 600 11px var(--sans); color: var(--accent); margin-right: 6px; vertical-align: 3px; }
  .red { color: var(--red); } .ot { color: var(--ot); }
  .ts { display: block; font: 600 13px var(--sans); color: var(--muted); margin: 14px 0 2px; }
  .par { display: grid; grid-template-columns: 28px repeat(var(--n), minmax(0, 1fr)); column-gap: 20px; }
  .par .head { position: sticky; top: -24px; background: var(--surface); padding: 6px 0 8px; font-weight: 600; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 8px; z-index: 1; }
  .par .row { display: contents; }
  .par .row > * { padding: 6px 0; font: var(--fs)/1.75 var(--read); cursor: pointer; user-select: none; }
  .par .row > .vn { font: 600 11px/2.6 var(--sans); padding-left: 6px; }
  /* 선택: 왼쪽 막대 + (하이라이트가 없으면) 연한 배경 */
  .verse.on, .par .row.on > .vn { box-shadow: inset 3px 0 0 var(--accent); }
  .verse.on:not([class*="hl-"]), .par .row.on:not([class*="hl-"]) > * { background: var(--accent-soft); }
  .hl-yellow, .verse.hl-yellow, .par .row.hl-yellow > * { background: var(--hl-yellow); }
  .hl-green, .verse.hl-green, .par .row.hl-green > * { background: var(--hl-green); }
  .hl-blue, .verse.hl-blue, .par .row.hl-blue > * { background: var(--hl-blue); }
  .hl-pink, .verse.hl-pink, .par .row.hl-pink > * { background: var(--hl-pink); }
  /* 히브리어 원문(BHS 등): 오른쪽→왼쪽, 음역·기본형 뜻은 작게 */
  .heb { font-family: "SBL Hebrew", "Ezra SIL", "Times New Roman", "Arial Hebrew", serif; }
  .verse.heb, .par .row > .heb { font-size: calc(var(--fs) * 1.25); line-height: 2.1; }
  .verse.heb.on { box-shadow: inset -3px 0 0 var(--accent); }
  .tr, .gl { font: .58em var(--sans); unicode-bidi: isolate; direction: ltr; margin: 0 3px; }
  .tr { color: var(--accent); font-style: italic; }
  .gl { color: var(--muted); }
  .kt { color: var(--muted); } .qr { color: var(--accent); }
  body.no-gloss .tr, body.no-gloss .gl { display: none; }
  /* 각주: 누르는 위첨자 */
  .fn { font: 600 .62em var(--sans); color: var(--accent); vertical-align: super; line-height: 0; padding: 0 2px; margin: 0 1px; border-radius: 4px; cursor: pointer; }
  .fn:hover, .fn:focus-visible { background: var(--accent-soft); outline: none; }
  #notePop { max-width: min(360px, calc(100vw - 32px)); font: 14px/1.7 var(--read); }
  #notePop b { font: 600 12px var(--sans); color: var(--accent); display: block; margin-bottom: 4px; }
  /* 원어 단어: 누르면 사전 팝업 */
  .w { cursor: pointer; border-radius: 4px; }
  .w:hover { background: var(--accent-soft); color: var(--accent); }
  .lex.heb { font-size: 1.3em; } .lex.grk { font-family: var(--serif); font-size: 1.1em; }
  /* 원어 팝업: 머리(번호·원어·버튼)는 고정, 풀이는 사전 탭과 같은 서식으로 스크롤 */
  #wordPop { width: min(460px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; padding-top: 0; overscroll-behavior: contain; }
  #wordPop .head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 12px 0 8px; margin-bottom: 4px; background: var(--surface); border-bottom: 1px solid var(--line); }
  #wordPop .head .ref { font: 600 12px var(--sans); color: var(--accent); }
  #wordPop .head .btn { margin-left: auto; }
  #wordPop .title { font-weight: 600; margin: 0 0 6px; }
  #wordPop .body { font: calc(var(--fs) - 2px)/1.8 var(--read); margin: 8px 0 4px; }
  #wordPop .body a[data-ref] { color: var(--accent); text-decoration: none; }
  #wordPop .alts { margin: 4px 0; font-size: 13px; }
  #wordPop .alts summary { color: var(--muted); cursor: pointer; padding: 4px 0; }
  #wordPop .alts button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px; font-size: 13px; }
  #wordPop .alts button:hover { background: var(--bg); }
  /* 탭 끌어서 순서 바꾸기 */
  .tab[draggable="true"] { cursor: grab; }
  .tab.dragging { opacity: .4; }
  .tab.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
  .tab.drop-after { box-shadow: inset -3px 0 0 var(--accent); }
  /* 내 세팅 */
  #presetBox { width: min(380px, calc(100vw - 32px)); }
  #presetBox .help { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
  #presetBox .slot { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  #presetBox .slot div { flex: 1; min-width: 0; }
  #presetBox .slot b { display: block; }
  #presetBox .slot small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 파일 관리 */
  #manageBox { width: min(400px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; }
  #manageBox h4 { font: 600 12px var(--sans); color: var(--muted); margin: 14px 0 4px; }
  #manageBox .help { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  #manageBox label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
  #manageBox label:hover { background: var(--bg); }
  #manageBox label small { margin-left: auto; color: var(--muted); }
  #manageBox input[type=checkbox] { width: 16px; height: 16px; flex: none; accent-color: var(--accent); }
  #manageBox .rename { flex: 1; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid transparent; border-radius: 6px; background: none; }
  #manageBox .rename:hover { border-color: var(--line); }
  #manageBox .rename:focus { border-color: var(--line); background: var(--bg); outline: 2px solid var(--accent); outline-offset: 1px; }
  #manageBox .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .dict-form { display: flex; gap: 8px; margin: 0 0 16px; }
  .dict-form input { flex: 1; min-width: 0; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .dict-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .linkish { border: 0; background: none; color: var(--accent); padding: 0; margin: 0 0 12px; font-weight: 600; }
  .note-badge { font: 600 11px var(--sans); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

  /* 선택 작업 막대 */
  .selbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--surface); }
  .selbar[hidden] { display: none; }
  .sel-ref { font-weight: 600; margin-right: 6px; }
  .swatches { display: flex; gap: 4px; align-items: center; margin: 0 6px; }
  .sw { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; padding: 0; }
  .sw:hover { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 주석 */
  .entry { font: calc(var(--fs) - 1px)/1.85 var(--read); max-width: 44em; padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry h3 { font: 600 13px var(--sans); color: var(--accent); margin: 0 0 8px -8px; padding: 4px 8px; border-radius: 6px; display: inline-block; }
  .entry.on h3 { background: var(--accent-soft); }
  .entry a[data-ref] { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }

  /* 검색 결과·보관함 목록 */
  .seg { display: flex; gap: 4px; margin: 0 0 16px; flex-wrap: wrap; }
  .hits-sum { color: var(--muted); margin: 0 0 12px; }
  .hit { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 8px; margin: 0 -8px; border-radius: 6px; font: calc(var(--fs) - 2px)/1.7 var(--read); }
  .hit:hover { background: var(--surface); }
  .hit .ref { font: 600 12px var(--sans); color: var(--accent); margin-right: 8px; }
  .hit .sw { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 8px; }
  .note-text { white-space: pre-wrap; font-family: var(--sans); font-size: 14px; }
  .saved h4 { font: 600 13px var(--sans); color: var(--muted); margin: 28px 0 6px; }
  .saved h4:first-child { margin-top: 0; }
  .saved .none { color: var(--muted); margin: 0; font-size: 13px; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
  .progress { color: var(--muted); }
  .credit { color: var(--muted); font-size: 12px; margin: 20px 0 0; }
  .search-opts { display: flex; flex-wrap: wrap; gap: 12px; margin: -6px 0 12px; font-size: 13px; color: var(--muted); }
  .search-opts select { height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); margin-left: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
  .chip { height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12px; }
  .chip:hover { background: var(--bg); }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .credit a { color: inherit; }

  /* 빈 화면 */
  .empty { max-width: 28em; margin: 12vh auto 0; color: var(--muted); }
  .empty h2 { color: var(--fg); font-size: 18px; margin: 0 0 8px; }
  .empty .btn { margin: 16px 8px 0 0; }
  .empty.small { margin-top: 8vh; text-align: center; }

  /* 팝오버 */
  .pop { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; display: none; }
  .pop.open { display: block; animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .pop.open { animation: none; } }
  #picker { width: min(560px, calc(100vw - 32px)); max-height: 75vh; overflow-y: auto; }
  #picker h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  #picker h4 + .grid { margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
  .grid button { height: 32px; border: 0; border-radius: 6px; background: var(--bg); }
  .grid button:hover, .grid button.on { background: var(--accent-soft); color: var(--accent); }
  #picker .back { border: 0; background: none; color: var(--accent); padding: 0; margin-bottom: 12px; font-weight: 600; }
  #menu { width: 260px; padding: 6px; }
  #menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; }
  #menu button:hover { background: var(--bg); }
  #menu small { display: block; color: var(--muted); }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  #tip { max-width: 380px; padding: 12px 14px; font: 14px/1.7 var(--read); pointer-events: none; }
  #tip b { font: 600 12px var(--sans); color: var(--accent); display: block; margin-bottom: 4px; }
  #noteBox { width: min(380px, calc(100vw - 32px)); }
  #noteBox label { display: block; font-weight: 600; margin-bottom: 8px; }
  #noteBox textarea { width: 100%; min-height: 140px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); line-height: 1.6; }
  #noteBox .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  #noteBox .actions .btn:first-child { margin-right: auto; }
  #esvBox { width: min(400px, calc(100vw - 32px)); }
  #esvBox label { display: block; font-weight: 600; margin-bottom: 6px; }
  #esvBox .help { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  #esvBox .help a { color: var(--accent); }
  #esvBox .err { color: var(--red); margin: 8px 0 0; }
  #esvBox .err:empty { display: none; }
  #esvBox input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: ui-monospace, monospace; }
  #esvBox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #esvBox .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #esvBox .actions .btn:first-child { margin-right: auto; }
  .muted { color: var(--muted); font-family: var(--sans); font-size: 13px; }
  .esv-notice { color: var(--muted); font: 12px/1.6 var(--sans); margin: 32px 0 0; padding-top: 12px; border-top: 1px solid var(--line); max-width: 42em; }

  @media (max-width: 760px) {
    .bar { flex-wrap: wrap; height: auto; padding: 8px 16px; }
    .search { flex: 1 1 100%; order: 9; margin: 0; }
    main, main.split { grid-template-columns: minmax(0, 1fr); grid-template-rows: 55% 45%; }
    main.split #pane2, [data-split], .resizer { display: none !important; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
    .scroll { padding: 16px 16px 48px; }
  }
</style>
</head>
<body>
<div class="bar">
  <button class="btn" id="back" title="이전 위치로 (Alt+←)" disabled>뒤로</button>
  <button class="btn icon" id="prev" title="이전 장 (←)" aria-label="이전 장">‹</button>
  <button class="btn ref-btn" id="refBtn" aria-haspopup="dialog">요한복음 3장</button>
  <button class="btn icon" id="next" title="다음 장 (→)" aria-label="다음 장">›</button>
  <input class="search" id="q" type="search" placeholder="검색 ( / )" aria-label="성경·주석 검색" title="여러 단어: 모두 들어 있는 절 · &quot;따옴표&quot;: 붙은 그대로 · H430, G26: 원어 번호">
  <button class="btn icon" id="smaller" title="글자 작게" aria-label="글자 작게" style="font-size:13px">가</button>
  <button class="btn icon" id="bigger" title="글자 크게" aria-label="글자 크게" style="font-size:17px">가</button>
  <button class="btn" id="fontBtn" title="본문 글꼴 바꾸기">명조</button>
  <button class="btn" id="presetBtn" aria-haspopup="dialog" title="보는 구성을 두 가지로 저장해 두고 바꾸기 (Alt+1, Alt+2)">내 세팅</button>
  <button class="btn" id="menuBtn" aria-haspopup="menu">파일</button>
  <span class="status" id="status" role="status"></span>
</div>
<div class="nudge" id="nudge" role="status" hidden>
  <span id="nudgeText"></span>
  <button class="btn sm primary" id="nudgeBackup">지금 백업</button>
  <button class="btn sm" id="nudgeLater">나중에</button>
</div>
<main id="main">
  <section class="pane">
    <div class="tabs" id="verTabs"></div>

<script>
const BOOKS = '창세기 출애굽기 레위기 민수기 신명기 여호수아 사사기 룻기 사무엘상 사무엘하 열왕기상 열왕기하 역대상 역대하 에스라 느헤미야 에스더 욥기 시편 잠언 전도서 아가 이사야 예레미야 예레미야애가 에스겔 다니엘 호세아 요엘 아모스 오바댜 요나 미가 나훔 하박국 스바냐 학개 스가랴 말라기 마태복음 마가복음 누가복음 요한복음 사도행전 로마서 고린도전서 고린도후서 갈라디아서 에베소서 빌립보서 골로새서 데살로니가전서 데살로니가후서 디모데전서 디모데후서 디도서 빌레몬서 히브리서 야고보서 베드로전서 베드로후서 요한일서 요한이서 요한삼서 유다서 요한계시록'.split(' ');
const SHORT = '창 출 레 민 신 수 삿 룻 삼상 삼하 왕상 왕하 대상 대하 스 느 에 욥 시 잠 전 아 사 렘 애 겔 단 호 욜 암 옵 욘 미 나 합 습 학 슥 말 마 막 눅 요 행 롬 고전 고후 갈 엡 빌 골 살전 살후 딤전 딤후 딛 몬 히 약 벧전 벧후 요일 요이 요삼 유 계'.split(' ');
const COLORS = { yellow: '노랑', green: '초록', blue: '파랑', pink: '분홍' };
const $ = id => document.getElementById(id);
const bibles = {}, comms = {}, dicts = {}, plain = {}, commText = {}, dictText = {}, indexing = {};
const marks = new Map(); // 하이라이트·메모: "책.장.절", 책갈피: "bm:책.장.절-절"
let SQL, hits = null, sel = new Set(), hist = [], noteV = 0;

const prefs = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const S = { b: 43, c: 3, v: 0, versions: [], comm: '', comm2: '', dict: '', split: false, tab: 'comm', ...prefs.get('state', {}) };
const save = () => prefs.set('state', { b: S.b, c: S.c, versions: S.versions, comm: S.comm, comm2: S.comm2, dict: S.dict, split: S.split, hideComm: S.hideComm });

// 줄 번호 → [책, 장, 절]
const REF = [];
VERSES.forEach((cs, bi) => cs.forEach((n, ci) => { for (let v = 1; v <= n; v++) REF.push([bi + 1, ci + 1, v]); }));
const refName = (b, c, v) => `${SHORT[b - 1]} ${c}:${v}`;
const order = m => m.b * 1e6 + m.c * 1e3 + m.v;
const sorted = () => [...sel].sort((a, b) => a - b);
// [16,17,18,20] → "16-18, 20"
const rangeLabel = vs => vs.reduce((a, v) => {
  const last = a.at(-1);
  if (last && v === last[1] + 1) last[1] = v; else a.push([v, v]);
  return a;
}, []).map(([f, t]) => f === t ? f : `${f}-${t}`).join(', ');

/* ---------- 브라우저 저장소 (IndexedDB). 막힌 환경이면 저장 없이 동작 ---------- */
function idb(store, mode, fn) {
  return new Promise((ok, no) => {
    const r = indexedDB.open('bible-viewer', 3);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
      if (!db.objectStoreNames.contains('marks')) db.createObjectStore('marks', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('cache')) db.createObjectStore('cache'); // 사전 요약 등 다시 만들 수 있는 것
    };
    r.onerror = () => no(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction(store, mode), q = fn(tx.objectStore(store));
      tx.oncomplete = () => ok(q.result);
      tx.onerror = () => no(tx.error);
    };
  });
}

const MODULE = /\.(ont|ot|nt|twm)$/i;
// 불러온 파일: 이름 → { key: 저장소 열쇠(원래 파일 이름), size }  (낱개 지우기에 씀)
const fileInfo = {};
// 화면에 보이는 이름: 파일 관리에서 바꾼 이름 → 잘 알려진 모듈의 기본 이름 → 파일 이름.
// (안쪽 구분은 늘 파일 이름이라, 이름을 바꿔도 순서·설정은 그대로)
const DEFAULT_NAMES = { 메튜: '매튜헨리', 호크마주석: '호크마', Hokma2: '호크마' };
let displayNames = prefs.get('names', {});
const nm = n => displayNames[n] || DEFAULT_NAMES[n] || n;
async function addFile(f) {
  const name = f.name.replace(/(\.(cmt|gbk|dct))?\.(twm|ont|ot|nt)$/i, '');
  fileInfo[name] = { key: f.name, size: f.size };
  const kind = f.name.match(/\.(ont|ot|nt)$/i)?.[1].toLowerCase();
  if (kind) { bibles[name] = parseOnt(new Uint8Array(await f.arrayBuffer()), kind); delete plain[name]; return; }
  // 주석·사전은 여기서 열지 않음 (필요할 때 openComm/openDict). 종류는 이름으로, 모르면 열어서 표를 봄
  let type = /\.cmt\.twm$/i.test(f.name) ? 'comm' : /\.(gbk|dct)\.twm$/i.test(f.name) ? 'dict' : '';
  if (!type) {
    const db = await sqlOpen(f), tables = rows(db, "select name from sqlite_master where type='table'", []).flat();
    db.close();
    // 주석은 성경 구절표(bible_refs), 사전·일반 도서는 항목표(topics)가 있음
    type = tables.includes('bible_refs') ? 'comm' : tables.includes('topics') ? 'dict' : '';
    if (!type) throw new Error('주석이나 사전 형식이 아닙니다');
  }
  if (type === 'comm') { comms[name]?.close(); delete comms[name]; commFiles[name] = f; delete commText[name]; }
  else {
    dicts[name]?.close(); delete dicts[name]; dictFiles[name] = f;
    for (const l of 'HG') delete dictSubjects[name + l];
    dictSize[name] = f.size; // 크기가 바뀌면(다른 파일) 저장된 요약을 새로 만듦
    for (const c of [dictText, dictLite, dictById, finders]) delete c[name];
  }
}

/* ---------- 주석·사전은 필요할 때만 열기 ----------
   호크마(155MB)처럼 큰 파일을 시작할 때마다 메모리에 올리지 않도록 */
const commFiles = {}, dictFiles = {}, opening = {};
async function sqlOpen(file) {
  SQL ||= await initSqlJs({ wasmBinary: Uint8Array.from(atob(window.SQL_WASM_B64), c => c.charCodeAt(0)) });
  return new SQL.Database(new Uint8Array(await file.arrayBuffer()));
}
function openDb(name, files, dbs) {
  if (dbs[name]) return Promise.resolve(dbs[name]);
  if (!files[name]) return Promise.reject(new Error('파일이 없습니다'));
  return opening[name] ||= sqlOpen(files[name]).then(db => dbs[name] = db).finally(() => delete opening[name]);
}
const openComm = name => openDb(name, commFiles, comms);
const openDict = name => openDb(name, dictFiles, dicts);
// 열어 둔 주석은 지금 보는 것(2단 보기면 2개)만 남기고 닫아 메모리를 비움 (검색 색인 중인 것은 그대로)
function closeUnusedComms() {
  const busy = Object.keys(indexing).join('\n');
  for (const n of Object.keys(comms))
    if (n !== S.comm && !(S.split && n === S.comm2) && !busy.endsWith(n) && !busy.includes(n + '\n')) { comms[n].close(); delete comms[n]; }
}

async function load(files, persist) {
  // theWord가 암호화한 유료 모듈(.ontx, .ntx 등)은 열 수 없음
  const locked = files.filter(f => /\.(ont|ot|nt|twm)x$/i.test(f.name)).map(f => f.name);
  if (locked.length) alert(`${locked.join(', ')}\n\n암호화된 theWord 모듈이라 열 수 없습니다. theWord 프로그램에서만 볼 수 있는 파일입니다.`);
  files = files.filter(f => MODULE.test(f.name));
  // 저장 공간이 부족할 때 브라우저가 임의로 지우지 않도록 영구 저장 요청 (지원 안 하면 무시)
  if (persist && files.length) navigator.storage?.persist?.().catch(() => {});
  for (const [i, f] of files.entries()) {
    $('status').textContent = `불러오는 중 ${i + 1}/${files.length} · ${f.name}`;
    try {
      await addFile(f);
      if (persist) await idb('files', 'readwrite', s => s.put(f, f.name)).catch(() => {});
    } catch (err) { alert(`${f.name}: 읽을 수 없습니다 (${err.message})`); }
  }
  $('status').textContent = '';
  const cn = commNames();
  S.versions = S.versions.filter(n => bibles[n] || (n === ESV && (esvKey || esvProxy)));
  if (!S.versions.length && allVersions().length) S.versions = [allVersions()[0]];
  sortVersions();
  if (!commFiles[S.comm]) S.comm = cn[0] || '';
  if (!dictFiles[S.dict]) S.dict = dictNames()[0] || '';
  if (S.tab === 'dict' && !S.dict) S.tab = 'comm';
  if (S.dict) liteOf(S.dict).catch(() => {}); // 사전 요약을 미리 뒤에서 (목록, 단어 팝업에 씀. 보관본이 있으면 바로)
  if (!commFiles[S.comm2] || S.comm2 === S.comm) S.comm2 = cn.find(n => n !== S.comm) || '';
  if (!S.comm2) S.split = false;
  go(S.b, S.c, S.v);
}

/* ---------- 이동 ---------- */
// jump: 책·장 선택, 링크, 검색 결과처럼 "건너뛰는" 이동이면 뒤로가기 기록을 남김
function go(b, c, v, jump) {
  c = Math.min(Math.max(c, 1), VERSES[b - 1].length);
  if (jump && (b !== S.b || c !== S.c || v !== S.v)) { hist.push({ b: S.b, c: S.c, v: S.v }); hist = hist.slice(-50); }
  $('back').disabled = !hist.length;
  S.b = b; S.c = c; S.v = v || 0;
  sel = new Set(S.v ? [S.v] : []);
  esvErrors.clear(); // 실패했던 ESV 장은 다시 열 때 재시도
  $('notePop').classList.remove('open'); $('wordPop').classList.remove('open'); // 다른 장으로 가면 이전 절의 작은 창은 닫음
  if (S.tab === 'search' && !hits) S.tab = 'comm';
  save();
  const recent = prefs.get('recent', []).filter(r => r.b !== b || r.c !== c);
  prefs.set('recent', [{ b, c }, ...recent].slice(0, 20));
  $('refBtn').textContent = `${BOOKS[b - 1]} ${c}장`;
  renderBible(); renderComm();
  $('bible').scrollTop = 0;
  if (S.v) select(S.v); else { $('comm').scrollTop = $('comm2').scrollTop = 0; renderSelbar(); }
}

function back() { const p = hist.pop(); if (p) go(p.b, p.c, p.v); }

function step(d) {
  const { b, c } = S;
  if (VERSES[b - 1][c - 1 + d]) return go(b, c + d);
  if (b + d >= 1 && b + d <= 66) go(b + d, d > 0 ? 1 : VERSES[b + d - 1].length);
}

/* ---------- 성경 ---------- */
const welcome = `<div class="empty"><h2>성경과 주석을 추가하세요</h2>
  <p><b>bible-viewer</b> 폴더를 통째로 고르면 그 안의 <b>성경</b>, <b>주석</b> 폴더를 한 번에 불러옵니다. 한 번 추가하면 다음부터는 자동으로 열립니다.</p>
  <p>파일은 이 컴퓨터 안에서만 읽고 어디에도 보내지 않습니다.</p>
  <button class="btn" onclick="$('folder').click()">폴더 열기</button><button class="btn" onclick="$('files').click()">파일 선택</button></div>`;

function verseMark(v) {
  const m = marks.get(`${S.b}.${S.c}.${v}`);
  return { cls: m?.color ? ` hl-${m.color}` : '', badge: m?.note ? `<button class="note-badge" data-note="${v}" title="메모 보기">메모</button>` : '' };
}

/* ---------- ESV (공식 API) ----------
   두 가지 경로: 사이트 공용 키(Vercel 서버 함수 /api/esv, 키는 서버에만) 또는 사용자가 직접 넣은 키.
   이용 조건: 비상업적, 한 화면 500절 이하, 임시 보관 500절 이하, 저작권 문구 표시 */
const ESV = 'ESV';
const ESV_NOTICE = 'Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.';
let esvKey = prefs.get('esvKey', ''), esvProxy = false;
const esvCache = new Map(), esvPending = new Map(), esvErrors = new Map(); // 키 "책.장"

async function fetchEsv(b, c, key = esvKey) {
  if (!key) { // 사이트 공용 키 (서버 함수가 대신 요청)
    const r = await fetch(`api/esv?b=${b}&c=${c}`).catch(() => { throw new Error('인터넷에 연결되어 있지 않습니다'); });
    if (!r.ok) throw new Error(r.status === 429 ? '오늘 ESV 사용량이 많습니다. 잠시 후 다시 열어 주세요' : `ESV를 사용할 수 없습니다 (${r.status})`);
    return (await r.json()).verses;
  }
  // ESV 서버는 키가 틀리면 CORS 헤더 없이 거절해서 브라우저에는 연결 실패(TypeError)로만 보임
  const r = await fetch('https://api.esv.org/v3/passage/text/?' + esvQuery(b, c), { headers: { Authorization: 'Token ' + key } })
    .catch(() => { throw new Error('API 키가 맞지 않거나 인터넷에 연결되어 있지 않습니다'); });
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'API 키가 맞지 않습니다' : r.status === 429 ? '요청이 너무 많습니다. 잠시 후 다시 열어 주세요' : `ESV 서버 오류 (${r.status})`);
  return parseEsv((await r.json()).passages?.[0] || '');
}

// 사이트에 공용 키가 설정돼 있는지 한 번 확인 (파일로 열었거나 설정이 없으면 조용히 넘어감)
async function probeEsvProxy() {
  if (esvKey || !/^https?:$/.test(location.protocol)) return;
  try {
    const vs = await fetchEsv(43, 3, '');
    if (Array.isArray(vs) && vs.length) { esvProxy = true; esvCache.set('43.3', vs); }
  } catch {}
}

// 캐시에 있으면 절 배열, 없으면 불러오기를 시작하고 null
function esvChapter(b, c) {
  const k = `${b}.${c}`;
  if (esvCache.has(k)) { const v = esvCache.get(k); esvCache.delete(k); esvCache.set(k, v); return v; }
  if (!esvPending.has(k) && !esvErrors.has(k)) {
    esvPending.set(k, fetchEsv(b, c).then(vs => {
      esvCache.set(k, vs);
      // 임시 보관은 500절까지 (오래 안 본 장부터 지움)
      let total = [...esvCache.values()].reduce((a, x) => a + x.length, 0);
      for (const old of esvCache.keys()) { if (total <= 500) break; total -= esvCache.get(old).length; esvCache.delete(old); }
    }).catch(err => esvErrors.set(k, err.message))
      .finally(() => { esvPending.delete(k); if (S.b === b && S.c === c) { refreshBible(); if (S.v) select(S.v); } }));
  }
  return null;
}

// 번역본 하나의 한 절 (ESV를 아직 못 받았으면 null)
function verseText(name, b, c, v) {
  if (name === ESV) { const ch = esvCache.get(`${b}.${c}`); return ch ? ch[v - 1] ?? '' : null; }
  return bibles[name]?.[START[b][c - 1] + v - 1] ?? '';
}
const firstLocal = () => S.versions.find(n => bibles[n]);

/* ---------- 탭 순서 (탭을 끌어서 바꿈, 브라우저에 기억) ---------- */
let tabOrder = prefs.get('order', {}); // { bible: [...], comm: [...], dict: [...] }
const ordered = (kind, names) => {
  const o = tabOrder[kind] || [], at = n => { const i = o.indexOf(n); return i < 0 ? 1e6 : i; }; // 처음 보는 건 뒤에
  return [...names].sort((a, b) => at(a) - at(b));
};
const allVersions = () => ordered('bible', [...Object.keys(bibles), ...(esvKey || esvProxy ? [ESV] : [])]);
const commNames = () => ordered('comm', Object.keys(commFiles));
const dictNames = () => ordered('dict', Object.keys(dictFiles));
// 대조 보기 칸·복사 순서도 탭 순서를 따름
const sortVersions = () => { S.versions = allVersions().filter(n => S.versions.includes(n)); };

// 히브리어처럼 오른쪽에서 왼쪽으로 쓰는 본문
const rtlAttr = name => bibles[name]?.rtl ? ' dir="rtl" class="heb"' : '';

function cellHtml(name, v) {
  if (name !== ESV) return verseHtml(verseText(name, S.b, S.c, v));
  const ch = esvChapter(S.b, S.c), err = esvErrors.get(`${S.b}.${S.c}`);
  return ch ? esc(ch[v - 1] ?? '') : `<span class="muted">${err && v === 1 ? `ESV를 불러오지 못했습니다: ${esc(err)}` : v === 1 ? 'ESV 불러오는 중…' : ''}</span>`;
}

function renderBible() {
  const names = allVersions();
  $('verTabs').innerHTML = names.map(n => `<button class="tab ${S.versions.includes(n) ? 'on' : ''}" data-ver="${n}" aria-pressed="${S.versions.includes(n)}" draggable="true" data-drag="bible:${n}" title="누르면 보기/끄기 · 끌어서 순서 바꾸기">${esc(nm(n))}</button>`).join('') +
    (S.versions.some(n => bibles[n]?.rtl) ? `<button class="tab spacer ${gloss ? 'on' : ''}" data-gloss aria-pressed="${gloss}" title="원어 아래 음역과 기본형 뜻 보이기">음역·뜻</button>` +
      `<button class="tab" data-word-side title="원어 단어를 누르면 뜻을 어디에 보여줄지">단어 뜻: ${wordSide ? '옆 사전' : '팝업'}</button>` : '') +
    (names.length > 1 ? `<span class="hint ${S.versions.some(n => bibles[n]?.rtl) ? '' : 'spacer'}">${S.versions.length > 1 ? '대조 보기 중' : '여러 개 고르면 대조'}</span>` : '') +
    (S.hideComm ? `<button class="tab on ${names.length > 1 || S.versions.some(n => bibles[n]?.rtl) ? '' : 'spacer'}" data-show-comm title="주석 칸 다시 열기">‹ 주석 보기</button>` : '');
  const vs = S.versions;
  if (!vs.length) { $('bible').innerHTML = names.length ? '<p class="empty small">위에서 성경 번역본을 고르세요.</p>' : welcome; return; }
  const { b, c } = S, n = VERSES[b - 1][c - 1];
  const title = `<h1 class="chapter-title">${BOOKS[b - 1]} ${c}장</h1>`;
  const ids = Array.from({ length: n }, (_, i) => i + 1);
  const notice = vs.includes(ESV) ? `<p class="esv-notice">${ESV_NOTICE}</p>` : '';
  if (vs.length === 1) {
    $('bible').innerHTML = title + ids.map(v => {
      const m = verseMark(v);
      return `<p class="verse${m.cls}${sel.has(v) ? ' on' : ''}${bibles[vs[0]]?.rtl ? ' heb" dir="rtl' : ''}" data-v="${v}"><span class="vn">${v}</span>${cellHtml(vs[0], v)}${m.badge}</p>`;
    }).join('') + notice;
  } else {
    $('bible').innerHTML = title + `<div class="par" style="--n:${vs.length}"><span class="head"></span>${vs.map(x => `<span class="head">${esc(nm(x))}</span>`).join('')}` +
      ids.map(v => {
        const m = verseMark(v);
        return `<div class="row${m.cls}${sel.has(v) ? ' on' : ''}" data-v="${v}"><span class="vn">${v}</span>${vs.map((x, i) => `<span${rtlAttr(x)}>${cellHtml(x, v)}${i ? '' : m.badge}</span>`).join('')}</div>`;
      }).join('') + '</div>' + notice;
  }
}

// 하이라이트·메모 바뀐 뒤 스크롤 위치를 지키며 다시 그림
function refreshBible() {
  const top = $('bible').scrollTop;
  renderBible(); $('bible').scrollTop = top; renderSelbar();
  if (S.tab === 'saved') renderComm();
}

/* ---------- 절 선택 (Shift: 범위, Cmd/Ctrl: 여러 개) ---------- */
function select(v, mode) {
  const vs = sorted();
  if (mode === 'range' && vs.length) {
    const from = Math.min(S.v || v, v), to = Math.max(S.v || v, v);
    sel = new Set(Array.from({ length: to - from + 1 }, (_, i) => from + i));
  } else if (mode === 'toggle') {
    sel.has(v) && sel.size > 1 ? sel.delete(v) : sel.add(v);
  } else sel = new Set([v]);
  if (mode !== 'range') S.v = v;
  $('bible').querySelectorAll('[data-v]').forEach(e => e.classList.toggle('on', sel.has(+e.dataset.v)));
  const p = $('bible').querySelector(`[data-v="${v}"]`);
  // 대조 보기의 행은 display:contents라 위치가 없으므로 첫 칸으로 스크롤
  if (p) (p.classList.contains('row') ? p.firstElementChild : p).scrollIntoView({ block: 'nearest' });
  renderSelbar();
  syncComm(v);
  if (S.tab === 'xref' && mode !== 'range') renderXref(); // 고른 절의 관련 구절로
}

function syncComm(v) {
  for (const id of ['comm', 'comm2']) {
    const entries = [...$(id).querySelectorAll('.entry')];
    entries.forEach(e => e.classList.remove('on'));
    const a = entries.find(e => +e.dataset.f <= v && v <= +e.dataset.t);
    if (a) { a.classList.add('on'); a.scrollIntoView(); }
  }
}

function renderSelbar() {
  const bar = $('selbar');
  if (!sel.size || !S.versions.length) { bar.hidden = true; return; }
  const vs = sorted(), first = vs[0];
  const bmId = `bm:${S.b}.${S.c}.${first}-${vs.at(-1)}`;
  const hasNote = marks.get(`${S.b}.${S.c}.${first}`)?.note;
  bar.hidden = false;
  bar.innerHTML = `<span class="sel-ref">${SHORT[S.b - 1]} ${S.c}:${rangeLabel(vs)}</span>
    <button class="btn sm" data-act="copy" title="Cmd/Ctrl+C">복사</button>
    <span class="swatches">${Object.entries(COLORS).map(([k, n]) => `<button class="sw hl-${k}" data-hl="${k}" title="${n} 하이라이트" aria-label="${n} 하이라이트"></button>`).join('')}
      <button class="btn sm" data-hl="" title="하이라이트 지우기">지우기</button></span>
    <button class="btn sm" data-act="note">${hasNote ? '메모 보기' : '메모'}</button>
    <button class="btn sm" data-act="bm">${marks.has(bmId) ? '책갈피 해제' : '책갈피'}</button>
    <button class="btn sm icon" data-act="clear" title="선택 해제 (Esc)" aria-label="선택 해제">×</button>`;
}

/* ---------- 복사 ---------- */
async function copySel() {
  const vs = sorted(), { b, c } = S;
  const label = `${BOOKS[b - 1]} ${c}:${rangeLabel(vs)}`;
  const t = (name, v) => plainVerse(verseText(name, b, c, v));
  // 아직 못 받은 ESV는 빼고 복사
  const text = S.versions.filter(name => verseText(name, b, c, vs[0]) !== null).map(name => `${label} (${nm(name)})\n` +
    (vs.length === 1 ? t(name, vs[0]) : vs.map(v => `${v} ${t(name, v)}`).join('\n'))).join('\n\n');
  try { await navigator.clipboard.writeText(text); }
  catch { // file:// 등 클립보드 API가 막힌 환경
    const t = Object.assign(document.createElement('textarea'), { value: text });
    document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
  }
  flash(`${label} 복사했습니다`);
}
let flashTimer;
function flash(msg) { $('status').textContent = msg; clearTimeout(flashTimer); flashTimer = setTimeout(() => $('status').textContent = '', 2500); }

/* ---------- 하이라이트·메모·책갈피 ---------- */
/* ---------- 백업 알림: 백업 안 한 변경이 10개 쌓이거나 7일이 지나면 ---------- */
const DAY = 864e5;
const backupState = () => prefs.get('backup', { dirty: 0, since: 0, nudgeAt: 10, snoozeUntil: 0 });
function markDirty() {
  const s = backupState();
  if (!s.dirty) s.since = Date.now();
  s.dirty++; prefs.set('backup', s); checkNudge();
}
function checkNudge() {
  const s = backupState(), now = Date.now();
  const show = s.dirty > 0 && now >= s.snoozeUntil && (s.dirty >= s.nudgeAt || now - s.since > 7 * DAY);
  $('nudge').hidden = !show;
  if (show) $('nudgeText').textContent = `백업하지 않은 메모·하이라이트·책갈피 변경이 ${s.dirty}개 있습니다. 브라우저 데이터가 지워지면 함께 사라지니 백업해 두세요.`;
}
// 나중에: 하루 동안 숨기고, 이후 10개가 더 쌓이거나 7일이 지나면 다시 알림
function snoozeNudge() {
  const s = backupState();
  prefs.set('backup', { ...s, nudgeAt: s.dirty + 10, snoozeUntil: Date.now() + DAY });
  checkNudge();
}

function putMark(m) {
  markDirty();
  m.t = Date.now();
  const empty = !m.bm && !m.color && !m.note;
  if (empty) marks.delete(m.id); else marks.set(m.id, m);
  idb('marks', 'readwrite', s => empty ? s.delete(m.id) : s.put(m)).catch(() => flash('저장하지 못했습니다. 브라우저 저장소가 막혀 있습니다'));
}
function setVerse(v, patch) {
  const id = `${S.b}.${S.c}.${v}`, m = { ...(marks.get(id) || { id, b: S.b, c: S.c, v }), ...patch };
  for (const k of ['color', 'note']) if (!m[k]) delete m[k];
  putMark(m);
}
function toggleBookmark() {
  const vs = sorted(), id = `bm:${S.b}.${S.c}.${vs[0]}-${vs.at(-1)}`;
  if (marks.has(id)) { marks.delete(id); markDirty(); idb('marks', 'readwrite', s => s.delete(id)).catch(() => {}); flash('책갈피를 해제했습니다'); }
  else { putMark({ id, bm: true, b: S.b, c: S.c, v: vs[0], v2: vs.at(-1) }); flash('책갈피에 추가했습니다'); }
  renderSelbar();
  if (S.tab === 'saved') renderComm();
}

function openNote(v, anchor) {
  noteV = v;
  $('noteRef').textContent = `${BOOKS[S.b - 1]} ${S.c}:${v} 메모`;
  $('noteText').value = marks.get(`${S.b}.${S.c}.${v}`)?.note || '';
  $('noteDel').hidden = !$('noteText').value;
  openPop($('noteBox'), anchor);
  $('noteText').focus();
}
function saveNote() {
  setVerse(noteV, { note: $('noteText').value.trim() });
  closePops(); refreshBible();
}

/* ---------- 백업 ---------- */
function exportMarks() {
  const data = JSON.stringify({ app: 'bible-viewer', version: 1, marks: [...marks.values()] }, null, 1);
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([data], { type: 'application/json' })),
    download: `성경뷰어-메모-${new Date().toISOString().slice(0, 10)}.json`,
  });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  prefs.set('backup', { dirty: 0, since: 0, nudgeAt: 10, snoozeUntil: 0 });
  checkNudge();
  flash('백업 파일을 다운로드 폴더에 저장했습니다');
}
// 외부 파일이므로 형식을 하나하나 확인한 항목만 받아들임
const validMark = m => m && typeof m.id === 'string' && /^(bm:)?\d+\.\d+\.\d+(-\d+)?$/.test(m.id) &&
  [m.b, m.c, m.v].every(Number.isInteger) && m.b >= 1 && m.b <= 66 && VERSES[m.b - 1][m.c - 1] >= m.v &&
  (m.note === undefined || typeof m.note === 'string') && (m.color === undefined || m.color in COLORS) &&
  (!m.bm || Number.isInteger(m.v2));
async function importMarks(file) {
  try {
    const list = JSON.parse(await file.text()).marks;
    if (!Array.isArray(list)) throw new Error('백업 파일 형식이 아닙니다');
    const ok = list.filter(validMark).map(m => ({ id: m.id, b: m.b, c: m.c, v: m.v, v2: m.v2, bm: m.bm || undefined, color: m.color, note: m.note, t: m.t || Date.now() }));
    for (const m of ok) Object.keys(m).forEach(k => m[k] === undefined && delete m[k]);
    await idb('marks', 'readwrite', s => { ok.forEach(m => s.put(m)); return s; });
    ok.forEach(m => marks.set(m.id, m));
    refreshBible();
    alert(`${ok.length}개를 불러왔습니다${list.length > ok.length ? ` (${list.length - ok.length}개는 형식이 맞지 않아 건너뜀)` : ''}.`);
  } catch (err) { alert(`백업을 불러오지 못했습니다: ${err.message}`); }
}

/* ---------- 주석 ---------- */
const rows = (db, sql, params) => { const st = db.prepare(sql); st.bind(params); const r = []; while (st.step()) r.push(st.get()); st.free(); return r; };

function commHtml(name) {
  if (!commFiles[name]) return `<p class="empty small">${Object.keys(bibles).length ? '주석 파일(.cmt.twm)을 추가하면 여기에 나옵니다.' : ''}</p>`;
  const db = comms[name];
  if (!db) { // 처음 볼 때 열고 다시 그림
    openComm(name).then(() => { closeUnusedComms(); renderComm(); if (S.v) syncComm(S.v); })
      .catch(err => flash(`${name}을(를) 열지 못했습니다: ${err.message}`));
    return `<p class="progress empty small">${esc(nm(name))} 여는 중…</p>`;
  }
  const { b, c } = S;
  // TEXT로 받으면 UTF-8 디코딩에서 RVF 바이트가 깨지므로 blob으로 받음
  const list = rows(db, 'select r.fvi, r.tvi, cast(c.data as blob) from bible_refs r join content c using(topic_id) where r.bi=? and r.ci=? order by r.fvi, r.topic_id', [b, c]);
  return list.length
    ? list.map(([f, t, d]) => `<article class="entry" data-f="${f}" data-t="${t}"><h3>${BOOKS[b - 1]} ${c}:${f === t ? f : f + '-' + t}</h3><div>${toHtml(d)}</div></article>`).join('')
    : `<p class="empty small">${esc(nm(name))}에는 ${BOOKS[b - 1]} ${c}장 주석이 없습니다.</p>`;
}

function renderComm() {
  closeUnusedComms(); // 2단 보기를 끄거나 주석을 바꾸면 안 보는 주석은 닫음
  const names = commNames();
  const tab = (on, attr, label) => `<button class="tab ${on ? 'on' : ''}" ${attr}>${label}</button>`;
  const drag = (kind, n) => `draggable="true" data-drag="${kind}:${n}" title="끌어서 순서 바꾸기"`;
  $('comTabs').innerHTML = names.map(n => tab(S.tab === 'comm' && S.comm === n, `data-comm="${n}" ${drag('comm', n)}`, esc(nm(n)))).join('') +
    dictNames().map(n => tab(S.tab === 'dict' && S.dict === n, `data-dict="${n}" ${drag('dict', n)}`, esc(nm(n)))).join('') +
    (hits ? tab(S.tab === 'search', 'data-search', '검색 결과') : '') +
    tab(S.tab === 'xref', 'data-xref', '교차 참조') +
    tab(S.tab === 'saved', 'data-saved', '보관함') +
    (names.length > 1 ? `<button class="tab spacer ${S.split ? 'on' : ''}" data-split aria-pressed="${S.split}">2단 보기</button>` : '') +
    `<button class="tab ${names.length > 1 ? '' : 'spacer'}" data-hide-comm title="주석 칸 숨기기 (성경 칸 위 '주석 보기'로 다시 열기)" aria-label="주석 칸 숨기기">숨기기 ›</button>`;
  $('main').classList.toggle('split', S.split);
  $('main').classList.toggle('no-comm', !!S.hideComm);
  if (S.tab === 'search' && hits) renderHits();
  else if (S.tab === 'saved') renderSaved();
  else if (S.tab === 'xref') renderXref();
  else if (S.tab === 'dict' && dictFiles[S.dict]) renderDict();
  else $('comm').innerHTML = commHtml(S.comm);
  if (S.split) {
    $('comTabs2').innerHTML = names.map(n => tab(S.comm2 === n, `data-comm2="${n}"`, esc(nm(n)))).join('');
    $('comm2').innerHTML = commHtml(S.comm2);
  }
}

/* ---------- 원어 사전 (스트롱 번호: H430 히브리어, G26 헬라어) ---------- */
// 지금 보는 항목, 찾은 목록, 전체 목록 언어(H/G), 목록으로 돌아올 스크롤 위치
const D = { q: '', entry: '', list: null, lang: 'H', scroll: 0, shown: '' };
// 전체 목록(H 또는 G)은 요약에서 바로 (사전 파일을 열지 않음)
const dictSubjects = {};
const subjects = (name, lang) => dictSubjects[name + lang] ||=
  dictLite[name].filter(e => e.s[0] === lang).sort((a, b) => a.s.slice(1) - b.s.slice(1));

// 사전 요약 [{s, h 원어, title, body 풀이 앞부분}]: 목록·단어 팝업에 씀.
// 처음 한 번만 사전 전체를 풀어 만들고(약 6초) 브라우저에 보관 → 다음부터는 바로 읽음
const dictSize = {}, dictLite = {}, liteLoading = {};
function liteOf(name) {
  if (dictLite[name]) return Promise.resolve(dictLite[name]);
  return liteLoading[name] ||= (async () => {
    const key = `dict:${name}:${dictSize[name]}`;
    let lite = await idb('cache', 'readonly', s => s.get(key)).catch(() => null);
    if (!Array.isArray(lite)) {
      const wasOpen = !!dicts[name];
      await openDict(name);
      lite = (await indexDict(name, () => {})).map(e => { const { title, body } = dictParts(e.text); return { s: e.s, h: e.h, title, body: body.slice(0, 300) }; });
      idb('cache', 'readwrite', s => s.put(lite, key)).catch(() => {});
      delete dictText[name]; // 전체 글자 색인은 한글 검색 때 다시 만듦 (메모리 절약)
      if (!wasOpen && !(S.tab === 'dict' && D.entry)) { dicts[name]?.close(); delete dicts[name]; } // 요약만 만들려고 연 거면 닫음
    }
    return dictLite[name] = lite;
  })().finally(() => delete liteLoading[name]);
}
const dictRow = subject => rows(dicts[S.dict], 'select t.subject, cast(c.data as blob) from topics t join content c on c.topic_id = t.id where t.subject = ?', [subject])[0];
// 항목 첫머리 "(430, 엘로힘) 하나님, 신들" 을 목록 제목으로
// (본문은 "אָב(1, 아브)  아버지 father  아브(명남)는…" 처럼 큰 공백으로 나뉨 → 제목은 앞의 두 덩어리, 나머지는 풀이)
function dictParts(text) {
  const i = text.search(/\(\d+,[^)]*\)/);
  if (i < 0) return { title: text.slice(0, 40).trim(), body: text.slice(40).trim() };
  const parts = text.slice(i).split(/\s{2,}/);
  return { title: parts.slice(0, 2).join(' ').trim(), body: parts.slice(2).join(' ').trim() };
}
const dictTitle = text => dictParts(text).title;
const lexHtml = (s, h) => h ? `<span class="lex ${s[0] === 'H' ? 'heb' : 'grk'}"${s[0] === 'H' ? ' dir="rtl"' : ''}>${esc(h)}</span> ` : '';
// 본문 속 "(…, 433: 하나님)" 같은 같은 언어 번호 참조를 누를 수 있게
const linkStrong = (html, lang) => html.replace(/(, )(\d{1,4})(:)/g, `$1<a href="#" data-strong="${lang}$2">$2</a>$3`);

let dictObs;
// scrollTo: 목록을 그린 뒤 맞출 스크롤 위치 (없으면 지금 위치 유지)
function renderDict(scrollTo) {
  const name = S.dict, box = $('comm'), keep = scrollTo ?? box.scrollTop;
  dictObs?.disconnect();
  const form = `<form class="dict-form" id="dictForm"><input id="dq" type="search" value="${esc(D.q)}" placeholder="H430, G26, 430 또는 한글 단어" aria-label="사전에서 찾기"><button class="btn sm primary">찾기</button></form>`;

  // 전체 풀이는 사전 파일을, 목록은 요약을 씀. 아직 없으면 준비한 뒤 다시 그림
  const need = D.entry ? !dicts[name] && openDict(name) : !dictLite[name] && liteOf(name);
  if (need) {
    box.innerHTML = form + `<p class="progress">${D.entry ? '사전 여는 중…' : '사전 준비 중… (처음 한 번만, 몇 초 걸립니다)'}</p>`;
    need.then(() => { if (S.tab === 'dict' && S.dict === name) renderDict(keep); }).catch(err => flash(`사전을 열지 못했습니다: ${err.message}`));
    return;
  }

  if (D.entry) {
    const row = dictRow(D.entry), same = D.shown === D.entry;
    box.innerHTML = form + '<button class="linkish" data-dict-back>‹ 목록</button>' + (row
      ? `<article class="entry"><h3>${esc(row[0])}</h3><div>${linkStrong(toHtml(row[1]), row[0][0])}</div></article>`
      : `<p class="empty small">${esc(D.entry)} 항목이 없습니다.</p>`);
    box.scrollTop = same ? keep : 0; // 같은 항목을 다시 그릴 때(장 이동 등)는 읽던 위치 유지
    D.shown = D.entry;
    return;
  }
  D.shown = '';

  // 찾은 목록 또는 전체 목록 (H/G)
  let items, head;
  if (D.list) {
    const re = D.q && !/^\d+$/.test(D.q) ? reEsc(D.q) : null;
    items = D.list.map(e => {
      const i = re ? e.text.indexOf(D.q) : -1;
      const snip = i > 0 ? ' · ' + (i > 40 ? '…' : '') + e.text.slice(Math.max(0, i - 40), i + D.q.length + 60) + '…' : '';
      return { s: e.s, h: e.h, title: dictTitle(e.text), snip: re ? esc(snip).replace(re, m => `<mark>${m}</mark>`) : esc(snip) };
    });
    head = `<p class="hits-sum">“${esc(D.q)}” ${items.length}개 항목 <button class="linkish" data-dict-clear>전체 목록 보기</button></p>`;
  } else {
    items = subjects(name, D.lang).map(e => ({ s: e.s, h: e.h, title: e.title, snip: '' }));
    head = `<div class="seg">${[['H', '히브리어'], ['G', '헬라어']].map(([l, t]) =>
      `<button class="tab ${D.lang === l ? 'on' : ''}" data-dict-lang="${l}">${t} ${subjects(name, l).length}</button>`).join('')}</div>`;
  }
  box.innerHTML = form + head + '<div id="dictList"></div><div id="dictMore"></div>';

  // 14,000개를 한 번에 그리면 느려서 스크롤에 맞춰 이어 붙임
  let n = 0;
  const more = () => $('dictList').insertAdjacentHTML('beforeend', items.slice(n, n += 300).map(e =>
    `<button class="hit" data-dict-go="${esc(e.s)}"><span class="ref">${esc(e.s)}</span>${lexHtml(e.s, e.h)}${esc(e.title)}${e.snip}</button>`).join(''));
  do more(); while (n < items.length && box.scrollHeight < keep + box.clientHeight * 2);
  box.scrollTop = keep;
  if (n < items.length) {
    dictObs = new IntersectionObserver(es => { if (es[0].isIntersecting) { more(); if (n >= items.length) dictObs.disconnect(); } }, { root: box, rootMargin: '800px' });
    dictObs.observe($('dictMore'));
  }
}

const indexDict = (name, progress) => indexDb(dictText, name, dicts[name],
  'select t.subject, cast(c.data as blob) from topics t join content c on c.topic_id = t.id order by t.rel_order',
  progress, ([s], text, html) => ({ s, text, h: headword(html) })); // h = 원어 표제어 (예: אֱלֹהִים)

// 색인이 끝난 사전: 번호 → 항목, 원어 기본형 → 번호 후보 (히브리어/헬라어 따로)
const dictById = {}, finders = {};
const byIdOf = name => dictById[name] ||= new Map(dictLite[name].map(e => [e.s, e]));
const finderOf = (name, lang) => (finders[name] ||= {
  H: lemmaFinder(dictLite[name].filter(e => e.s[0] === 'H')), G: lemmaFinder(dictLite[name].filter(e => e.s[0] === 'G')),
})[lang];

async function dictSearch(q) {
  D.q = q = q.trim(); D.entry = ''; D.list = null;
  const num = q.match(/^([HhGg])?\s*(\d{1,5})$/);
  if (num?.[1]) { D.entry = num[1].toUpperCase() + +num[2]; return renderDict(0); }
  const name = S.dict, want = D;
  if (num) { // 번호만: 히브리어·헬라어 둘 다 (요약에서)
    await liteOf(name);
    const info = byIdOf(name);
    D.list = ['H', 'G'].map(p => info.get(p + +num[2])).filter(Boolean).map(e => ({ s: e.s, h: e.h, text: e.title }));
    if (D.list.length === 1) { D.entry = D.list[0].s; D.list = null; }
    return renderDict(0);
  }
  if (!q) return renderDict(0);
  $('comm').innerHTML = `<p class="progress">${esc(name)}에서 찾는 중…</p>`;
  const texts = await openDict(name).then(() => indexDict(name, p => { const el = $('comm').querySelector('.progress'); if (el) el.textContent = `${name} 색인 중 ${Math.round(p * 100)}% (처음 한 번만)`; }))
    .catch(err => { $('comm').innerHTML = `<p class="empty small">찾지 못했습니다: ${esc(err.message)}</p>`; });
  if (!texts || want.q !== q || S.tab !== 'dict') return;
  // 제목(항목 첫머리)에 있는 것을 앞에
  D.list = texts.filter(e => e.text.includes(q)).sort((a, b) => !dictTitle(a.text).includes(q) - !dictTitle(b.text).includes(q));
  renderDict(0);
}

/* ---------- 교차 참조 (OpenBible.info, CC BY 4.0) ----------
   data/xrefs.js 를 처음 열 때만 불러옴 (스크립트 형태라 파일로 연 index.html에서도 됨) */
let xrefLines = null, xrefLoading = null;
function loadXrefs() {
  if (xrefLines) return Promise.resolve(xrefLines);
  return xrefLoading ||= new Promise((ok, no) => {
    const s = Object.assign(document.createElement('script'), { src: 'data/xrefs.js' });
    s.onload = () => { xrefLines = window.XREFS.split('\n'); delete window.XREFS; ok(xrefLines); };
    s.onerror = () => { xrefLoading = null; no(new Error('교차 참조 파일을 불러오지 못했습니다')); };
    document.head.append(s);
  });
}
function renderXref() {
  const box = $('comm');
  if (!xrefLines) {
    box.innerHTML = '<p class="progress empty small">교차 참조 불러오는 중…</p>';
    loadXrefs().then(() => S.tab === 'xref' && renderXref()).catch(err => { box.innerHTML = `<p class="empty small">${esc(err.message)}</p>`; });
    return;
  }
  const credit = '<p class="credit">교차 참조: <a href="https://www.openbible.info/labs/cross-references/" target="_blank" rel="noopener">OpenBible.info</a> (CC BY 4.0), 사용자 투표 순</p>';
  if (!S.v) { box.innerHTML = '<p class="empty small">절을 고르면 관련 구절이 나옵니다.</p>' + credit; return; }
  const list = parseXrefs(xrefLines[START[S.b][S.c - 1] + S.v - 1]), ver = firstLocal();
  const label = (s, n) => refName(...REF[s]) + (n ? '-' + (REF[s + n][1] === REF[s][1] ? REF[s + n][2] : `${REF[s + n][1]}:${REF[s + n][2]}`) : '');
  box.innerHTML = `<p class="hits-sum">${BOOKS[S.b - 1]} ${S.c}:${S.v} 관련 구절 ${list.length}개</p>` +
    (list.length ? list.map(([s, n]) => `<button class="hit" data-go="${REF[s].join('.')}"><span class="ref">${label(s, n)}</span>` +
      (ver ? esc(plainVerse(bibles[ver][s])) + (n ? ' …' : '') : '') + '</button>').join('') : '<p class="empty small">이 절에는 교차 참조가 없습니다.</p>') + credit;
  box.scrollTop = 0;
}

/* ---------- 원어 단어 → 사전 팝업 ----------
   스트롱 번호 태그(<WH430>)가 있으면 그 번호로, BHS처럼 기본형만 있으면 사전 표제어와 맞대어 번호를 찾음 */
// 후보 순서: BHS의 영어 뜻이 풀이 첫머리에 있는 것 먼저, 아람어 항목은 뒤로, 나머지는 번호 순
function rankCandidates(ids, gloss, name) {
  const info = byIdOf(name), words = (gloss || '').toLowerCase().split(/[^a-z]+/).filter(x => x.length > 2);
  const score = s => {
    const e = info.get(s), t = `${e?.title || ''} ${e?.body || ''}`.slice(0, 200).toLowerCase();
    return (words.some(x => t.includes(x)) ? 2 : 0) - (t.slice(0, 120).includes('아람') ? 1 : 0);
  };
  return [...ids].sort((a, b) => score(b) - score(a) || a.slice(1) - b.slice(1));
}

async function showWord(w) {
  const pop = $('wordPop'), name = S.dict;
  const show = html => { pop.innerHTML = html; openPop(pop, w); }; // 다른 단어를 누르면 그 단어 옆으로
  if (!name) return show('<p class="muted">원어 사전 파일(.gbk.twm)을 추가하면 단어 뜻이 나옵니다.</p>');
  show('<p class="muted">사전 준비 중… (처음 한 번, 몇 초 걸립니다)</p>');
  const ready = await liteOf(name).catch(() => null);
  if (!ready || !pop.classList.contains('open')) return;
  const lemma = w.dataset.lemma || '';
  const ids = w.dataset.strong ? w.dataset.strong.split(',')
    : rankCandidates(finderOf(name, /[֐-׿]/.test(lemma) ? 'H' : 'G')(lemma), w.dataset.gloss, name);
  pop.dataset.ids = ids.join(',');
  // 옆 사전 모드: 첫 후보를 사전 탭에 열고, 다른 후보는 "‹ 목록"에
  if (wordSide && !S.hideComm && ids.length) { // 주석 칸을 숨겼으면 팝업으로
    closePops();
    const info = byIdOf(name);
    D.q = lemma; D.entry = ids[0]; D.scroll = 0;
    D.list = ids.length > 1 ? ids.map(s => info.get(s)).filter(Boolean).map(e => ({ s: e.s, h: e.h, text: e.title })) : null;
    S.tab = 'dict'; return renderComm();
  }
  wordPopAt(0, lemma);
}

function wordPopAt(i, lemma = '') {
  const pop = $('wordPop'), ids = pop.dataset.ids ? pop.dataset.ids.split(',') : [], info = byIdOf(S.dict), e = info.get(ids[i]);
  if (!e) {
    // 한 글자짜리 접두어(וְ 그리고, הַ 정관사 등)는 스트롱 사전에 번호가 없음
    const prefix = /^[א-ת][֑-ׇ]*$/.test(lemma);
    pop.innerHTML = `<p class="muted">${lemma ? `<span class="lex heb" dir="rtl">${esc(lemma)}</span> ` : ''}${prefix
      ? '접두어(그리고, 정관사, 전치사 등)라 사전에 따로 실려 있지 않습니다.' : '사전에서 찾지 못했습니다.'}</p>`;
    return;
  }
  const { title, body } = e;
  // 먼저 요약으로 바로 보여주고, 사전 파일을 열면 전체 풀이(사전과 같은 줄바꿈·서식)로 바꿈
  pop.innerHTML = `<div class="head"><span class="ref">${e.s}</span>${lexHtml(e.s, e.h)}
    <button class="btn sm" data-open="${e.s}">사전 탭에서 보기</button></div>` +
    (ids.length > 1 ? `<details class="alts"><summary>같은 철자 다른 후보 ${ids.length - 1}개</summary>${ids.map((s, k) => k === i ? '' :
      `<button data-alt="${k}"><span class="ref">${s}</span> ${lexHtml(s, info.get(s)?.h)}${esc(info.get(s)?.title || '')}</button>`).join('')}</details>` : '') +
    `<div class="body" id="wordBody"><p class="title">${esc(title)}</p>${esc(body)}…</div>`;
  pop.scrollTop = 0; placePop(pop);
  const name = S.dict;
  openDict(name).then(() => {
    const row = dictRow(e.s), box = $('wordBody');
    if (row && box && pop.classList.contains('open') && pop.dataset.ids.split(',')[i] === e.s) { box.innerHTML = linkStrong(toHtml(row[1]), e.s[0]); placePop(pop); }
  }).catch(() => {});
}

// 각주 위첨자 → 작은 창 (마우스를 올리면 브라우저 말풍선으로도 보임)
function showNote(fn) {
  const v = fn.closest('[data-v]')?.dataset.v;
  $('notePop').innerHTML = `<b>${refName(S.b, S.c, v)} 각주 ${esc(fn.textContent)}</b>${esc(fn.dataset.fn)}`;
  openPop($('notePop'), fn);
}
$('notePop').onclick = e => e.stopPropagation();
$('bible').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('fn')) showNote(e.target); });

$('wordPop').onclick = e => {
  e.stopPropagation();
  const alt = e.target.closest('[data-alt]');
  if (alt) return wordPopAt(+alt.dataset.alt);
  const open = e.target.closest('[data-open]');
  if (open) { closePops(); S.tab = 'dict'; D.entry = open.dataset.open; D.list = null; renderComm(); return; }
  // 풀이 속 링크: 번호 참조는 팝업 안에서 그 항목으로, 성경 구절은 그 구절로
  const st = e.target.closest('[data-strong]');
  if (st) { e.preventDefault(); $('wordPop').dataset.ids = st.dataset.strong; return wordPopAt(0); }
  const ref = e.target.closest('a[data-ref]');
  if (ref) { e.preventDefault(); closePops(); const [b, c, v] = parseRef(ref.dataset.ref); if (b) go(b, c, v, true); }
};

/* ---------- 검색 (성경 / 주석) ---------- */
const reEsc = q => new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');

// 검색: 여러 단어(모두 포함), "따옴표"(붙은 그대로), H430·G26(원어 번호). 번역본·범위·책으로 좁히기
function search(q) {
  q = q.trim();
  if (!q) { hits = null; S.tab = 'comm'; return renderComm(); }
  const Q = parseQuery(q), prev = hits;
  hits = {
    q, Q, bible: null, comm: null, book: 0,
    // 고른 번역본은 다음 검색에도 유지 (원어 번호 검색 때 자동으로 고른 원어 성경은 제외)
    ver: prev && !prev.Q.strong && bibles[prev.ver] ? prev.ver : '', range: prev?.range || 'all',
    scope: prev?.scope === 'comm' && !Q.strong ? 'comm' : 'bible',
  };
  // 히브리어 번호를 '신약'에서, 헬라어 번호를 '구약'에서 찾으면 늘 0개 → 범위를 전체로
  if (Q.strong && hits.range === (Q.strong[0] === 'H' ? 'nt' : 'ot')) hits.range = 'all';
  S.tab = 'search'; renderComm();
  runBibleSearch();
}

// 검색어 표시: 이미 "따옴표"가 있으면 그대로, 아니면 “ ”로 감쌈
const qLabel = q => /"/.test(q) ? esc(q) : `“${esc(q)}”`;
const inRange = (b, range) => range === 'ot' ? b <= 39 : range === 'nt' ? b >= 40 : range === 'book' ? b === S.b : true;
// 원어 정보(BHS 기본형 또는 <WH430> 태그)가 있는 성경인지
const hasOriginal = (n, lang) => bibles[n] && (bibles[n].orig ??= {
  H: bibles[n].some(l => l.includes('<sub>') || l.includes('<WH')), G: bibles[n].some(l => l.includes('<WG')),
})[lang];

async function runBibleSearch() {
  const h = hits;
  if (h.Q.strong) {
    const lang = h.Q.strong[0];
    h.ver = hasOriginal(h.ver, lang) ? h.ver : allVersions().find(n => hasOriginal(n, lang)) || '';
    if (!h.ver) { h.bible = []; h.note = `원어 번호 검색은 ${lang === 'H' ? 'BHS처럼 원어 기본형' : '스트롱 번호 태그'}이 있는 성경이 필요합니다.`; return renderHits(); }
    h.bible = await strongVerses(h.Q.strong, h.ver).catch(() => []);
  } else {
    h.ver ||= firstLocal() || ''; // ESV는 장 단위로만 받을 수 있어 전체 검색에서 제외
    plain[h.ver] ||= h.ver ? bibles[h.ver].map(plainVerse) : [];
    h.bible = plain[h.ver].reduce((a, t, i) => (h.Q.test(t) && a.push(i), a), []);
  }
  if (hits === h && S.tab === 'search') renderHits();
}

// 원어 번호가 나오는 절: <WH430> 태그, 또는 BHS 기본형을 사전 표제어와 맞대어 (같은 철자 단어도 함께 나올 수 있음)
async function strongVerses(num, ver) {
  const L = bibles[ver], lang = num[0], tag = new RegExp(`<W${lang}0*${num.slice(1)}[a-z]?>`);
  const find = S.dict ? (await liteOf(S.dict), finderOf(S.dict, lang)) : null;
  const memo = new Map(), out = [];
  for (let i = 0; i < L.length; i++) {
    const line = L[i];
    if (!line) continue;
    if (tag.test(line)) { out.push(i); continue; }
    if (!find || !line.includes('<sub>')) continue;
    for (const m of line.matchAll(/<sub>(?:<font[^>]*>)?([֐-׿]+)/g)) {
      let ids = memo.get(m[1]);
      if (!ids) memo.set(m[1], ids = find(m[1]));
      if (ids.includes(num)) { out.push(i); break; }
    }
  }
  return out;
}

// 주석 전체를 글자로 풀어 둠 (처음 한 번만, 수 초 걸림)
const htmlText = h => h.replace(/<br>/g, ' ').replace(/<[^>]+>/g, '')
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');

// 주석·사전 전체를 글자로 풀어 둠 (처음 한 번만, 수 초 걸림). sql의 마지막 열이 본문
async function indexDb(cache, name, db, sql, progress, entry) {
  if (cache[name]) return cache[name];
  const key = sql + name;
  return indexing[key] ||= (async () => {
    const total = rows(db, `select count(*) from (${sql})`, [])[0][0], st = db.prepare(sql), out = [];
    try {
      while (st.step()) {
        const row = st.get(), html = toHtml(row.at(-1));
        out.push(entry(row, htmlText(html), html));
        if (out.length % 400 === 0) { progress(out.length / total); await new Promise(r => setTimeout(r)); }
      }
      return cache[name] = out;
    } finally { st.free(); delete indexing[key]; } // 실패해도 다음 검색에서 다시 시도
  })();
}
const indexComm = (name, progress) => indexDb(commText, name, comms[name],
  'select r.bi, r.ci, r.fvi, r.tvi, cast(c.data as blob) from bible_refs r join content c using(topic_id) order by r.bi, r.ci, r.fvi',
  progress, ([b, c, f, t], text) => ({ b, c, f, t, text }));

async function searchComm() {
  const name = S.comm, h = hits;
  if (!name) return;
  const texts = await openComm(name).then(() => indexComm(name, p => {
    const el = hits === h && S.tab === 'search' && $('comm').querySelector('.progress');
    if (el) el.textContent = `${name} 주석 색인 중 ${Math.round(p * 100)}% (처음 한 번만)`;
  })).catch(err => { if (hits === h) $('comm').querySelector('.progress')?.replaceChildren(`주석 검색에 실패했습니다: ${err.message}`); });
  if (!texts) return;
  if (hits !== h) return;
  h.comm = { name, list: texts.filter(e => h.Q.test(e.text)) };
  if (S.tab === 'search') renderHits();
}

function renderHits() {
  const h = hits, mk = s => h.Q.re && !h.Q.strong ? esc(s).replace(h.Q.re, m => `<mark>${m}</mark>`) : esc(s);
  const inR = b => inRange(b, h.range);
  const bibleList = (h.bible || []).filter(i => inR(REF[i][0]));
  const commList = h.comm?.name === S.comm ? h.comm.list.filter(e => inR(e.b)) : null;
  const locals = allVersions().filter(n => bibles[n] && (!h.Q.strong || hasOriginal(n, h.Q.strong[0])));
  let html = `<div class="seg">
    ${locals.length ? `<button class="tab ${h.scope === 'bible' ? 'on' : ''}" data-scope="bible">성경 ${h.bible ? bibleList.length : '…'}</button>` : ''}
    ${S.comm && !h.Q.strong ? `<button class="tab ${h.scope === 'comm' ? 'on' : ''}" data-scope="comm">주석 · ${esc(nm(S.comm))}${commList ? commList.length : ''}</button>` : ''}</div>
    <div class="search-opts">
      ${h.scope === 'bible' && locals.length > 1 ? `<label>번역본 <select data-sopt="ver">${locals.map(n => `<option value="${esc(n)}" ${n === h.ver ? 'selected' : ''}>${esc(nm(n))}</option>`).join('')}</select></label>` : ''}
      <label>범위 <select data-sopt="range">${[['all', '전체'], ['ot', '구약'], ['nt', '신약'], ['book', `현재 책 (${BOOKS[S.b - 1]})`]]
        .map(([v, t]) => `<option value="${v}" ${v === h.range ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    </div>`;
  if (h.scope === 'bible') {
    if (h.note) { $('comm').innerHTML = html + `<p class="hits-sum">${h.note}</p>`; return; }
    if (!locals.length) { $('comm').innerHTML = html + '<p class="hits-sum">성경 파일(.ont)을 추가하면 성경에서 찾을 수 있습니다.</p>'; return; }
    if (!h.bible) { $('comm').innerHTML = html + `<p class="progress">${qLabel(h.q)} 찾는 중…</p>`; return; }
    // 원어 성경(BHS)에서 찾았으면 본문은 읽기 쉬운 번역본으로
    const show = bibles[h.ver]?.rtl ? (allVersions().find(n => bibles[n] && !bibles[n].rtl) || h.ver) : h.ver;
    plain[show] ||= bibles[show].map(plainVerse);
    const byBook = {};
    for (const i of bibleList) byBook[REF[i][0]] = (byBook[REF[i][0]] || 0) + 1;
    const ot = bibleList.filter(i => REF[i][0] <= 39).length, shown = h.book ? bibleList.filter(i => REF[i][0] === h.book) : bibleList;
    html += `<p class="hits-sum">${qLabel(h.q)} ${bibleList.length}절 (구약 ${ot}, 신약 ${bibleList.length - ot})${h.Q.strong ? ` · ${esc(nm(h.ver))}의 원어 기준, 같은 철자 단어가 함께 나올 수 있음` : ''}</p>` +
      (Object.keys(byBook).length > 1 ? `<div class="chips">${h.book ? '<button class="chip" data-sbook="0">전체</button>' : ''}${Object.entries(byBook)
        .map(([b, n]) => `<button class="chip ${+b === h.book ? 'on' : ''}" data-sbook="${b}">${SHORT[b - 1]} ${n}</button>`).join('')}</div>` : '') +
      (shown.length > 500 ? '<p class="muted">처음 500절만 표시합니다. 범위나 책을 골라 좁혀 보세요.</p>' : '') +
      shown.slice(0, 500).map(i => `<button class="hit" data-i="${i}"><span class="ref">${refName(...REF[i])}</span>${mk(plain[show][i])}</button>`).join('') +
      (!bibleList.length ? '<p class="muted">여러 단어는 모두 들어 있는 절을, "따옴표"는 붙은 그대로, H430·G26은 원어 번호로 찾습니다.</p>' : '');
  } else if (!S.comm) {
    html += '<p class="hits-sum">주석 파일을 추가하면 주석에서도 찾을 수 있습니다.</p>';
  } else if (h.comm?.name !== S.comm) {
    $('comm').innerHTML = html + `<p class="progress">${S.comm} 주석에서 찾는 중…</p>`;
    return searchComm(); // 진행률 칸을 먼저 그린 뒤 색인 시작
  } else {
    const list = commList, low = h.Q.terms[0]?.toLowerCase() || '';
    html += `<p class="hits-sum">${qLabel(h.q)} ${list.length}개 항목${list.length > 300 ? ', 처음 300개만 표시' : ''}</p>` +
      list.slice(0, 300).map(e => {
        const i = Math.max(0, e.text.toLowerCase().indexOf(low)), snip = (i > 50 ? '…' : '') + e.text.slice(Math.max(0, i - 50), i + low.length + 90) + '…';
        return `<button class="hit" data-go="${e.b}.${e.c}.${e.f}" data-to-comm><span class="ref">${SHORT[e.b - 1]} ${e.c}:${e.f === e.t ? e.f : e.f + '-' + e.t}</span>${mk(snip)}</button>`;
      }).join('');
  }
  $('comm').innerHTML = html;
}

function openPop(el, anchor) {
  closePops();
  el._anchor = anchor;
  el.classList.add('open');
  placePop(el);
}
// 팝업이 화면 밖으로 나가지 않게: 아래 자리가 되면 아래, 아니면 위, 둘 다 부족하면 화면 안에 맞춤.
// 내용이 나중에 채워져 길어지면(원어 전체 풀이 등) 다시 부름
function placePop(el) {
  if (!el.classList.contains('open') || !el._anchor?.isConnected) return;
  el.style.maxHeight = ''; // CSS 기본 높이로 재고
  const r = el._anchor.getBoundingClientRect(), w = el.offsetWidth, gap = 6, edge = 8;
  const below = innerHeight - r.bottom - gap - edge, above = r.top - gap - edge;
  // 아래가 되면 아래, 아니면 위, 둘 다 부족하면 넓은 쪽에 맞춰 높이를 줄임 (누른 단어를 가리지 않게, 나머지는 팝업 안 스크롤)
  let h = el.offsetHeight, down = h <= below || (h > above && below >= above);
  if (h > (down ? below : above)) { h = Math.max(120, down ? below : above); el.style.maxHeight = h + 'px'; }
  el.style.left = Math.max(16, Math.min(r.left, innerWidth - w - 16)) + 'px';
  el.style.top = Math.max(edge, down ? r.bottom + gap : r.top - gap - h) + 'px';
}
addEventListener('resize', () => document.querySelectorAll('.pop.open').forEach(placePop));
const closePops = () => document.querySelectorAll('.pop.open').forEach(p => p.id !== 'tip' && p.classList.remove('open'));

let dragging = null; // "bible:개역개정" 처럼 종류:이름
const clearDrop = box => box.querySelectorAll('.dragging, .drop-before, .drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after'));
const kindOf = d => d.slice(0, d.indexOf(':')), nameOf = d => d.slice(d.indexOf(':') + 1);
for (const box of [$('verTabs'), $('comTabs')]) {
  box.addEventListener('dragstart', e => {
    const t = e.target.closest('[data-drag]'); if (!t) return;
    dragging = t.dataset.drag;
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragging);
    t.classList.add('dragging');
  });
  box.addEventListener('dragover', e => {
    const t = e.target.closest('[data-drag]');
    if (!t || !dragging || kindOf(t.dataset.drag) !== kindOf(dragging)) return; // 같은 종류끼리만
    e.preventDefault();
    box.querySelectorAll('.drop-before, .drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
    const r = t.getBoundingClientRect();
    t.classList.add(e.clientX < r.left + r.width / 2 ? 'drop-before' : 'drop-after');
  });
  box.addEventListener('drop', e => {
    const t = e.target.closest('[data-drag]'); if (!t || !dragging) return;
    e.preventDefault();
    moveTab(dragging, t.dataset.drag, t.classList.contains('drop-after'));
  });
  box.addEventListener('dragend', () => { dragging = null; clearDrop(box); });
}
function moveTab(from, to, after) {
  const kind = kindOf(from), a = nameOf(from), b = nameOf(to);
  if (kind !== kindOf(to) || a === b) return;
  const list = (kind === 'bible' ? allVersions() : kind === 'comm' ? commNames() : dictNames()).filter(n => n !== a);
  list.splice(list.indexOf(b) + (after ? 1 : 0), 0, a);
  tabOrder[kind] = list; prefs.set('order', tabOrder);
  sortVersions(); save(); refreshBible(); renderComm(); if (S.v) syncComm(S.v);
}

async function removeModules(items) {
  for (const it of items) {
    const kind = kindOf(it), name = nameOf(it);
    if (kind === 'bible') { delete bibles[name]; delete plain[name]; }
    if (kind === 'comm') { comms[name]?.close(); delete comms[name]; delete commText[name]; delete commFiles[name]; }
    if (kind === 'dict') {
      dicts[name]?.close(); delete dicts[name];
      await idb('cache', 'readwrite', s => s.delete(`dict:${name}:${dictSize[name]}`)).catch(() => {});
      for (const c of [dictText, dictLite, dictById, finders, dictSize, dictFiles]) delete c[name];
      for (const l of 'HG') delete dictSubjects[name + l];
    }
    if (fileInfo[name]) await idb('files', 'readwrite', s => s.delete(fileInfo[name].key)).catch(() => {});
    delete fileInfo[name];
  }
  await load([], false); // 선택된 번역본·주석·사전을 남은 것으로 다시 맞추고 화면 갱신
}
